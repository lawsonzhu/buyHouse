<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>买房研究 · 每日成交</title>
<style>
  :root{
    --bg:#f6f4ef; --bg-soft:#fbfaf7; --card:#ffffff;
    --ink:#1f2328; --ink-2:#5b6168; --ink-3:#8b9098;
    --line:#e6e2d9; --line-2:#efece4;
    --accent:#b1503a; --accent-soft:#f6e9e4;
    --shadow:0 1px 2px rgba(31,35,40,.04), 0 8px 24px -12px rgba(31,35,40,.14);
    --radius:14px;
  }
  *{box-sizing:border-box}
  .topnav{
    position:sticky;top:0;z-index:40;
    background:rgba(246,244,239,.9);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{max-width:1080px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:18px}
  .brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .brand .dot{width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--accent),#d98b6f)}
  .tabs{margin-left:auto;display:flex;gap:6px}
  .tab{
    padding:7px 16px;border-radius:9px;font-size:13.5px;color:var(--ink-2);
    border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;
  }
  .tab:hover{background:#fff;border-color:var(--line);color:var(--ink)}
  .tab.on{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(31,35,40,.05)}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #fdf7f2 0%, rgba(253,247,242,0) 60%),
      radial-gradient(900px 500px at 100% 0%, #eef4f1 0%, rgba(238,244,241,0) 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:40px 28px 80px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;
    color:var(--accent);background:var(--accent-soft);
    border:1px solid rgba(177,80,58,.16);padding:5px 12px;border-radius:999px;font-weight:600;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.02em;margin:18px 0 10px;font-weight:700}
  .lede{color:var(--ink-2);font-size:14.5px;max-width:72ch;margin:0}
  .lede b{color:var(--ink)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:26px 2px 8px}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:18px;height:0;border-top:2.5px solid var(--accent);border-radius:2px}
  .legend .sw.dash{border-top-style:dashed;border-top-color:var(--ink-2)}
  .legend .sw.ref{border-top-style:dotted;border-top-color:var(--ink-3)}
  .chartcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 8px}
  .chartcard svg{width:100%;height:auto;display:block}
  .chart-note{font-size:11.5px;color:var(--ink-3);margin:8px 2px 0;line-height:1.7}
  .chart-note b{color:var(--ink-2);font-weight:600}

  .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin-top:14px}
  table.tx{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  table.tx th{
    text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;
    padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg-soft);
    white-space:nowrap;position:sticky;top:0;
  }
  table.tx td{padding:10px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:top}
  table.tx tr:last-child td{border-bottom:none}
  table.tx tbody tr{transition:background .12s}
  table.tx tbody tr:hover{background:#faf7f2}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td .src{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
  td .note{display:block;font-size:11.5px;color:var(--ink-3);white-space:normal;max-width:300px}
  .na{color:var(--ink-3)}
  .tsum{font-size:11.5px;color:var(--ink-3);margin:14px 2px 0;line-height:1.7}
  .tsum b{color:var(--ink-2);font-weight:600}
  .dist{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
  .dist b{font-weight:600;color:var(--ink)}
  .dist i{font-style:normal;display:inline-flex;gap:5px;align-items:baseline;font-size:11.5px;color:var(--ink-3);background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
  .foot{margin-top:40px;font-size:12px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
  @media (max-width:640px){ .wrap{padding:36px 16px 60px} }
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav-inner">
    <span class="brand"><span class="dot"></span>买房研究</span>
    <div class="tabs">
      <a class="tab on" href="index.html">每日成交</a>
      <a class="tab" href="deals.html">成交明细</a>
      <a class="tab" href="library.html">资料库</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <span class="eyebrow" style="margin-top:8px"><span class="dot"></span>每日成交</span>
  <h1>南京二手房每日成交</h1>
  <p class="lede">全市每日趋势：网签套数 + 成交价样本中位。网签为网上房地产口径（T+1 披露，当日记「待披露」），价格样本为公开渠道成交明细快照，<b>两套口径不可互换</b>；数据非实时核验，交易决策请以平台实时页面与经纪人核验为准。按小区查成交请到<b>成交明细</b>页。</p>

  <div class="legend">
    <i><span class="sw"></span>二手住宅网签（套）</i>
    <i><span class="sw dash"></span>样本单价中位（元/㎡，右轴）</i>
    <i><span class="sw ref"></span>第 43 周日均 262 套</i>
  </div>
  <div class="chartcard"><svg id="trendChart" viewBox="0 0 720 280" role="img" aria-label="南京二手房每日成交趋势图"></svg></div>
  <p class="chart-note" id="chartNote"></p>

  <div class="tscroll">
    <table class="tx">
      <thead>
        <tr>
          <th>日期</th>
          <th class="num">网签(套)</th>
          <th class="num">样本(条)</th>
          <th class="num">单价中位</th>
          <th class="num">总价中位(万)</th>
          <th class="num">面积中位㎡</th>
          <th>说明 / 来源</th>
        </tr>
      </thead>
      <tbody id="dayBody"></tbody>
    </table>
  </div>
  <div class="dist" id="dayDist"></div>
  <p class="tsum" id="dayNote"></p>

  <div class="foot">
    <span>数据文件：transactions.js（同目录，手工维护）</span>
    <span id="stamp"></span>
  </div>
</main>

<script src="transactions.js"></script>
<script>
const TXDAILY = window.TX_DAILY || [];
const WEEK_AVG = 262;

const dayBody = document.getElementById('dayBody');
const dayDist = document.getElementById('dayDist');
const dayNote = document.getElementById('dayNote');
const chartEl = document.getElementById('trendChart');
const chartNote = document.getElementById('chartNote');

document.getElementById('stamp').textContent = '页面生成于 2026-11-02';

const fmt = (v,suffix) => v==null ? '<span class="na">未公示</span>' : Number(Math.round(v)).toLocaleString('zh-CN') + (suffix||'');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderChart(){
  const rows = [...TXDAILY].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  if(!rows.length){ chartEl.innerHTML=''; return; }
  const W=720,H=280,P={l:48,r:58,t:22,b:36}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const xs = i => rows.length>1 ? P.l+iw*i/(rows.length-1) : P.l+iw/2;
  const nets = rows.map(d=>d.net).filter(v=>v!=null);
  const units = rows.map(d=>d.unit).filter(v=>v!=null);
  const nMax = Math.max(WEEK_AVG, ...nets, 1)*1.2;
  const uMax = Math.max(...units,1)*1.18;
  const yN = v => P.t+ih*(1-v/nMax);
  const yU = v => P.t+ih*(1-v/uMax);
  let s = '';
  for(let g=0; g<=4; g++){
    const y = yN(nMax*g/4);
    s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#efece4" stroke-width="1"/>`;
    s += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#8b9098">${Math.round(nMax*(1-g/4))}</text>`;
    s += `<text x="${W-P.r+8}" y="${y+4}" font-size="10.5" fill="#b6aa9f">${Math.round(uMax*(1-g/4))}</text>`;
  }
  const yr = yN(WEEK_AVG);
  s += `<line x1="${P.l}" y1="${yr}" x2="${W-P.r}" y2="${yr}" stroke="#8b9098" stroke-width="1.2" stroke-dasharray="2 4"/>`;
  s += `<text x="${W-P.r-4}" y="${yr-5}" text-anchor="end" font-size="10" fill="#8b9098">周均 262 套</text>`;
  let path='', seg=false;
  rows.forEach((d,i)=>{
    if(d.net==null){ seg=false; return; }
    path += (seg?' L':' M') + xs(i).toFixed(1) + ' ' + yN(d.net).toFixed(1);
    seg = true;
  });
  s += `<path d="${path}" fill="none" stroke="#b1503a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  rows.forEach((d,i)=>{
    if(d.net!=null){
      const x=xs(i), y=yN(d.net);
      s += `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="#b1503a" stroke-width="2"/>`;
      s += `<text x="${x}" y="${y-9}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b1503a">${d.net}</text>`;
    }
    if(d.unit!=null){
      const x=xs(i), y=yU(d.unit);
      s += `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="#5b6168" stroke-width="2"/>`;
      s += `<text x="${x}" y="${y-9}" text-anchor="middle" font-size="10" fill="#5b6168">${d.unit.toLocaleString('zh-CN')}</text>`;
    }
  });
  s += `<line x1="${P.l}" y1="${P.t+ih}" x2="${W-P.r}" y2="${P.t+ih}" stroke="#e6e2d9"/>`;
  rows.forEach((d,i)=>{
    s += `<text x="${xs(i)}" y="${P.t+ih+18}" text-anchor="middle" font-size="10.5" fill="#5b6168">${(d.date||'').slice(5)}</text>`;
  });
  chartEl.innerHTML = s;
}

function renderDaily(){
  const rows = [...TXDAILY].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  dayBody.innerHTML = rows.map(d => `
    <tr>
      <td>${esc(d.date||'—')}</td>
      <td class="num">${d.net == null ? '<span class="na">待披露</span>' : fmt(d.net)}</td>
      <td class="num">${d.sample == null ? '<span class="na">—</span>' : d.sample}</td>
      <td class="num">${fmt(d.unit)}</td>
      <td class="num">${fmt(d.total)}</td>
      <td class="num">${d.area == null ? '<span class="na">—</span>' : d.area}</td>
      <td style="white-space:normal">
        ${d.note ? `<span class="note">${esc(d.note)}</span>` : ''}
        <span class="src">${esc(d.source||'')} · 检索 ${esc(d.checked||'')}</span>
      </td>
    </tr>`).join('');

  const latest = rows.find(d => d.dist);
  document.getElementById('dayDist').innerHTML = latest
    ? `<span style="font-size:11.5px;color:var(--ink-3);align-self:center">${esc(latest.date)} 分区单价中位：</span>` +
      Object.entries(latest.dist).sort((a,b) => b[1]-a[1])
        .map(([k,v]) => `<i>${esc(k)}<b>${Math.round(v).toLocaleString('zh-CN')}</b></i>`).join('')
    : '';

  document.getElementById('chartNote').innerHTML = '<b>读图：</b>红实线为每日二手住宅网签套数（左轴），灰虚线为当日成交价样本的单价中位（右轴），灰点线为最近一周日均网签参考。'
    + '样本中位由当日公开渠道明细计算，样本量少时波动大，看方向不看绝对值。';
  dayNote.innerHTML = '<b>口径说明：</b>网签套数取南京网上房地产「存量房·住宅」日成交，公布有 1 日延迟；价格样本取公开渠道当日成交价明细，'
    + '属「部分房源」非全量，且样本结构偏向老城区高价盘与远郊低价盘，故单价中位<b>不可直接当作全市均价</b>。';
}

renderChart();
renderDaily();
</script>
</body>
</html>
